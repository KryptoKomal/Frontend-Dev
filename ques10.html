<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <header>
    <h1>Location & Favorite Place Selection</h1>
  </header>

  <main>
    <label for="country">Country:</label><br>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="france">France</option>
      <option value="japan">Japan</option>
    </select><br><br>

    <label for="state">State:</label><br>
    <select id="state" name="state">
      <option value="up" selected>Uttar Pradesh</option>
      <option value="mh">Maharashtra</option>
      <option value="ka">Karnataka</option>
    </select><br><br>

    <label for="city">City:</label><br>
    <select id="city" name="city">
      <option value="mathura" selected>Mathura</option>
      <option value="agra">Agra</option>
      <option value="delhi">Delhi</option>
    </select><br><br>

    <label for="place">Favorite Tourist Place:</label><br>
    <select id="place" name="place">
      <option value="vrindavan" selected>Vrindavan</option>
      <option value="taj">Taj Mahal</option>
      <option value="reddy">Local Park</option>
    </select>

    <p>You have selected: Country - India; State - Uttar Pradesh; City - Mathura; Favorite Place - Vrindavan.</p>
  </main>

  <footer>
    <p>© 2025 Selections</p>
  </footer>
</body>
</html>
