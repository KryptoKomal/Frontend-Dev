<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing - Q5</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <main class="pricing-wrap">
    <div class="pricing-card small">
      <h2>Basic</h2>
      <p class="price">₹499</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
      </ul>
      <button>Choose</button>
    </div>

    <div class="pricing-card featured">
      <h2>Standard</h2>
      <p class="price">₹999</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
        <li>Feature C</li>
      </ul>
      <button>Choose</button>
    </div>

    <div class="pricing-card small">
      <h2>Premium</h2>
      <p class="price">₹1,999</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
        <li>Feature C</li>
        <li>Feature D</li>
      </ul>
      <button>Choose</button>
    </div>
  </main>
</body>
</html>
