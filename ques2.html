<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <header>
    <h1>Tooltips</h1>
  </header>

  <main class="center-row">
    <div class="tip-wrap">
      <span class="target">HTML</span>
      <span class="tooltip">HyperText Markup Language</span>
    </div>

    <div class="tip-wrap">
      <span class="target">CSS</span>
      <span class="tooltip">Cascading Style Sheets</span>
    </div>

    <div class="tip-wrap">
      <span class="target">IMG</span>
      <span class="tooltip">Image element</span>
    </div>
  </main>

  <footer>
    <p>Hover each label to see the tooltip</p>
  </footer>
</body>
</html>
