<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
  </header>

  <main class="gallery">
    <figure class="item">
      <img src="img1.jpg" alt="Image 1">
      <figcaption>Caption One</figcaption>
    </figure>
    <figure class="item">
      <img src="img2.jpg" alt="Image 2">
      <figcaption>Caption Two</figcaption>
    </figure>
    <figure class="item">
      <img src="img3.jpg" alt="Image 3">
      <figcaption>Caption Three</figcaption>
    </figure>
    <figure class="item">
      <img src="img4.jpg" alt="Image 4">
      <figcaption>Caption Four</figcaption>
    </figure>
    <figure class="item">
      <img src="img5.jpg" alt="Image 5">
      <figcaption>Caption Five</figcaption>
    </figure>
    <figure class="item">
      <img src="img6.jpg" alt="Image 6">
      <figcaption>Caption Six</figcaption>
    </figure>
  </main>

  <footer>
    <p>Responsive image grid</p>
  </footer>
</body>
</html>
