<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload Form</title>
</head>
<body>
  <h1>Upload Image</h1>
  <form>
    <input type="file" accept=".jpg, .png" required><br><br>
    <input type="submit" value="Upload">
  </form>
  <p>Only JPG or PNG files are allowed.</p>
</body>
</html>
